# 未验证（2026-11-17）：本仓库无 git 远端，本文件从未被 GitHub Actions 实际触发过。
# 这不是“已启用的 CI”，只是给将来推送后留一个手动入口；触发方式仅 workflow_dispatch。
# 预期限制：全量门禁依赖 .gitignore 排除的样本与 binutils，本工作流只跑不依赖样本的两项。
# 不要把本文件的“成功”当成全量门禁已绿——全量请在本机跑 pack\tools\gate.ps1。
name: gate-draft-unverified

on:
  workflow_dispatch:

jobs:
  ledger-and-index:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ledger_check --check
        run: python pack/tools/ledger_check.py --check
      - name: evidence_index --check
        run: python "pack/04_rekit项目源码/tests/evidence_index.py" --check
      - name: notice
        run: echo "Full gate (23 verify suites + pytest) requires samples/binutils excluded by .gitignore; run pack/tools/gate.ps1 locally."
